name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  issues: write

jobs:

  # ── AI gate ───────────────────────────────────────────────────────────────
  # Same gate that python-image.yml / java-image.yml run.
  # Checks the diff for hardcoded secrets, bad K8s YAML, and AI-reviewed rules.
  ai-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: rkamradt/ci-workflows
          path: _gate
          ref: main

      - name: Install tools
        run: |
          GITLEAKS_VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          KL_VER=0.6.8
          mkdir -p /tmp/kl && \
            curl -sSfL "https://github.com/stackrox/kube-linter/releases/download/v${KL_VER}/kube-linter_linux_amd64.tar.gz" \
            | tar xz -C /tmp/kl && cp /tmp/kl/kube-linter /usr/local/bin/ 2>/dev/null || true
          npm install -g @anthropic-ai/claude-code --quiet

      - name: Run AI gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GATE_DIR: ${{ github.workspace }}/_gate/ai-gate
        run: bash _gate/ai-gate/gate.sh

  # ── SAM CI ────────────────────────────────────────────────────────────────
  # Starts LocalStack as a Docker step (not a service container) so we can
  # mount /var/run/docker.sock — LocalStack needs the Docker socket to spawn
  # Lambda execution containers. Service containers can't mount host paths.
  sam-ci:
    needs: [ai-gate]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Official LocalStack GH Action: starts LocalStack with the Docker socket
      # mounted, waits for it to be healthy, and exports AWS_ENDPOINT_URL.
      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          image-tag: "4.4"
          install-awslocal: "false"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SAM CLI + local tools
        run: pip install aws-sam-cli-local pytest httpx boto3

      - name: Configure AWS credentials for LocalStack
        # Env vars take priority over ~/.aws/credentials. AWS_ENDPOINT_URL
        # redirects all AWS CLI calls to LocalStack instead of real AWS.
        run: |
          echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV
          echo "AWS_ENDPOINT_URL=http://localhost:4566" >> $GITHUB_ENV

      - name: SAM build
        run: samlocal build

      - name: SAM deploy
        run: |
          samlocal deploy \
            --stack-name claim-intake \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              AnthropicApiKey=mock \
              UseRealAI=false

      - name: Smoke — GET /health
        # LocalStack API Gateway uses path-based routing:
        #   http://localhost:4566/restapis/<id>/<stage>/_user_request_/<path>
        # Look up the API ID via the CloudFormation physical resource ID —
        # more reliable than filtering by name which SAM may override.
        run: |
          API_ID=$(aws cloudformation describe-stack-resource \
            --stack-name claim-intake \
            --logical-resource-id ClaimIntakeApi \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          echo "API_ID=${API_ID}"
          API_URL="http://localhost:4566/restapis/${API_ID}/v1/_user_request_"
          echo "API_URL=${API_URL}" >> $GITHUB_ENV
          RESPONSE=$(curl -s "${API_URL}/health")
          echo "Response: ${RESPONSE}"
          STATUS=$(echo "${RESPONSE}" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          test "${STATUS}" = "ok"

      - name: Unit tests
        run: pytest tests/unit -v

      - name: E2E tests
        env:
          API_URL: ${{ env.API_URL }}
          LOCALSTACK_URL: http://localhost:4566
          USE_REAL_AI: "false"
        run: pytest tests/e2e -v
