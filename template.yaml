AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  claim-intake — serverless insurance claim ingestion and AI extraction pipeline.
  Runs entirely on LocalStack (no real AWS account required).

Parameters:
  StageName:
    Type: String
    Default: v1
  AnthropicApiKey:
    Type: String
    Default: ""
    NoEcho: true
  UseRealAI:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    # Per-Lambda env vars are declared on each function individually.

Resources:

  # ── SQS ───────────────────────────────────────────────────────────────────
  # ExtractQueue carries extracted claim JSON from the extract Lambda to the
  # verify Lambda. PR 4 adds a DLQ (after 3 failed receives) and the
  # NeedsReviewQueue for claims that fail verification.
  ExtractQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: claim-intake-extract
      VisibilityTimeout: 90   # must be >= VerifyFunction timeout

  # ── DynamoDB ──────────────────────────────────────────────────────────────
  ClaimsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: claims
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # ── S3 ────────────────────────────────────────────────────────────────────
  # The S3 → Lambda notification creates UploadBucket → ExtractFunction.
  # If ExtractFunction also referenced the bucket via !Ref, CloudFormation
  # would see a cycle. Solution: use the literal bucket name in ExtractFunction
  # (breaking the reverse dependency), wire the notification manually with
  # DependsOn, and grant S3 permission to invoke the Lambda explicitly.

  ExtractFunctionS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ExtractFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::claim-intake-uploads"

  UploadBucket:
    Type: AWS::S3::Bucket
    DependsOn: ExtractFunctionS3Permission
    Properties:
      BucketName: claim-intake-uploads
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
            Function: !GetAtt ExtractFunction.Arn

  # ── API Gateway ───────────────────────────────────────────────────────────
  ClaimIntakeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      Description: claim-intake REST API

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-health
      Handler: handler.lambda_handler
      CodeUri: lambdas/health/
      Description: Liveness check — returns 200 + service status
      Environment:
        Variables:
          USE_REAL_AI: !Ref UseRealAI
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimIntakeApi
            Path: /health
            Method: GET

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-upload
      Handler: handler.lambda_handler
      CodeUri: lambdas/upload/
      Description: >
        POST /uploads — generates a presigned S3 PUT URL.
        Client uploads the document directly to S3; this Lambda never touches
        the document body, keeping it out of API Gateway's 10 MB payload limit.
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimIntakeApi
            Path: /uploads
            Method: POST

  ClaimFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-get-claim
      Handler: handler.lambda_handler
      CodeUri: lambdas/claim/
      Description: GET /claims/{id} — returns a stored claim record from DynamoDB.
      Environment:
        Variables:
          CLAIMS_TABLE: !Ref ClaimsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ClaimsTable
      Events:
        ClaimApi:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimIntakeApi
            Path: /claims/{id}
            Method: GET

  # ── S3-triggered extract Lambda ───────────────────────────────────────────
  # ExtractFunction uses literal "claim-intake-uploads" (not !Ref) to avoid
  # a circular dependency with UploadBucket. See note above UploadBucket.
  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-extract
      Handler: handler.lambda_handler
      CodeUri: lambdas/extract/
      Description: >
        Triggered by S3 ObjectCreated. Reads the document, calls Anthropic
        (or returns a mock), and puts structured JSON onto ExtractQueue.
      Timeout: 60
      Environment:
        Variables:
          UPLOAD_BUCKET: "claim-intake-uploads"
          EXTRACT_QUEUE_URL: !Ref ExtractQueue
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          USE_REAL_AI: !Ref UseRealAI
      Policies:
        - S3ReadPolicy:
            BucketName: "claim-intake-uploads"
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ExtractQueue.QueueName

  # ── SQS-triggered verify Lambda ───────────────────────────────────────────
  VerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-verify
      Handler: handler.lambda_handler
      CodeUri: lambdas/verify/
      Description: >
        Consumes ExtractQueue. Runs code checks on the AI output and writes
        accepted or needs_review records to DynamoDB with a conditional put
        (idempotency — duplicate SQS deliveries never create a second record).
      Timeout: 60
      Environment:
        Variables:
          CLAIMS_TABLE: !Ref ClaimsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ClaimsTable
      Events:
        SQSExtract:
          Type: SQS
          Properties:
            Queue: !GetAtt ExtractQueue.Arn
            BatchSize: 1
            # ReportBatchItemFailures: the Lambda returns a list of message IDs
            # that failed so SQS retries only those, not the whole batch.
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  ApiUrl:
    Description: Base URL for the claim-intake API
    Value: !Sub "https://${ClaimIntakeApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  BucketName:
    Description: S3 bucket for uploaded claim documents
    Value: !Ref UploadBucket
  ClaimsTableName:
    Description: DynamoDB claims table
    Value: !Ref ClaimsTable
  ExtractQueueUrl:
    Description: SQS queue between extract and verify
    Value: !Ref ExtractQueue
