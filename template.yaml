AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  claim-intake — serverless insurance claim ingestion and AI extraction pipeline.
  Runs entirely on LocalStack (no real AWS account required).

Parameters:
  StageName:
    Type: String
    Default: v1
  AnthropicApiKey:
    Type: String
    Default: ""
    NoEcho: true
  UseRealAI:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    # Per-Lambda env vars are declared on each function individually.

Resources:

  # ── S3 ────────────────────────────────────────────────────────────────────
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: claim-intake-uploads

  # ── API Gateway ───────────────────────────────────────────────────────────
  ClaimIntakeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      Description: claim-intake REST API

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-health
      Handler: handler.lambda_handler
      CodeUri: lambdas/health/
      Description: Liveness check — returns 200 + service status
      Environment:
        Variables:
          USE_REAL_AI: !Ref UseRealAI
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimIntakeApi
            Path: /health
            Method: GET

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-upload
      Handler: handler.lambda_handler
      CodeUri: lambdas/upload/
      Description: >
        POST /uploads — generates a presigned S3 PUT URL.
        Client uploads the document directly to S3; this Lambda never touches
        the document body, keeping it out of API Gateway's 10 MB payload limit.
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimIntakeApi
            Path: /uploads
            Method: POST

  ClaimFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-get-claim
      Handler: handler.lambda_handler
      CodeUri: lambdas/claim/
      Description: >
        GET /claims/{id} — returns a stored claim record.
        Stub in PR 2; wired to DynamoDB in PR 3.
      Events:
        ClaimApi:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimIntakeApi
            Path: /claims/{id}
            Method: GET

  # ── S3-triggered extract Lambda ───────────────────────────────────────────
  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-extract
      Handler: handler.lambda_handler
      CodeUri: lambdas/extract/
      Description: >
        Triggered by S3 ObjectCreated. Reads the document, calls Anthropic
        (or returns a mock), and logs structured JSON.
        PR 3 adds: puts the result to SQS for the verify Lambda.
      Timeout: 60
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          USE_REAL_AI: !Ref UseRealAI
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
      Events:
        S3Upload:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

Outputs:
  ApiUrl:
    Description: Base URL for the claim-intake API
    Value: !Sub "https://${ClaimIntakeApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  BucketName:
    Description: S3 bucket for uploaded claim documents
    Value: !Ref UploadBucket
