AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  claim-intake — serverless insurance claim ingestion and AI extraction pipeline.
  Runs entirely on LocalStack (no real AWS account required).

Parameters:
  StageName:
    Type: String
    Default: v1
  AnthropicApiKey:
    Type: String
    Default: ""
    NoEcho: true
  UseRealAI:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  GapThresholdMinutes:
    Type: String
    Default: "10"
    Description: >
      Reconcile Lambda flags S3 objects older than this many minutes with no
      DynamoDB record. Set low (e.g. 2) for local testing.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256

Resources:

  # ── SQS ───────────────────────────────────────────────────────────────────

  # Dead-letter queue: messages land here after 3 failed processing attempts.
  # Retention: 14 days (max), giving the ops team time to inspect and redrive.
  ExtractDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: claim-intake-extract-dlq
      MessageRetentionPeriod: 1209600  # 14 days in seconds

  # Main extract→verify queue. RedrivePolicy wires it to the DLQ.
  ExtractQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: claim-intake-extract
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExtractDLQ.Arn
        maxReceiveCount: 3

  # Receives a message for every claim that fails verification.
  # Consumers (alerts, human-review workflows) subscribe to this queue.
  # In this project it is the signal source for the reconcile report.
  NeedsReviewQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: claim-intake-needs-review

  # ── DynamoDB ──────────────────────────────────────────────────────────────
  ClaimsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: claims
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: s3_key
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: s3_key-index
          KeySchema:
            - AttributeName: s3_key
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ── S3 ────────────────────────────────────────────────────────────────────
  ExtractFunctionS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ExtractFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::claim-intake-uploads"

  UploadBucket:
    Type: AWS::S3::Bucket
    DependsOn: ExtractFunctionS3Permission
    Properties:
      BucketName: claim-intake-uploads
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
            Function: !GetAtt ExtractFunction.Arn

  # ── API Gateway ───────────────────────────────────────────────────────────
  ClaimIntakeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      Description: claim-intake REST API

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-health
      Handler: handler.lambda_handler
      CodeUri: lambdas/health/
      Description: Liveness check — returns 200 + service status
      Environment:
        Variables:
          USE_REAL_AI: !Ref UseRealAI
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimIntakeApi
            Path: /health
            Method: GET

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-upload
      Handler: handler.lambda_handler
      CodeUri: lambdas/upload/
      Description: POST /uploads — generates a presigned S3 PUT URL.
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimIntakeApi
            Path: /uploads
            Method: POST

  ClaimFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-get-claim
      Handler: handler.lambda_handler
      CodeUri: lambdas/claim/
      Description: GET /claims/{id} — returns a stored claim record from DynamoDB.
      Environment:
        Variables:
          CLAIMS_TABLE: !Ref ClaimsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ClaimsTable
      Events:
        ClaimApi:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimIntakeApi
            Path: /claims/{id}
            Method: GET

  # ── S3-triggered extract Lambda ───────────────────────────────────────────
  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-extract
      Handler: handler.lambda_handler
      CodeUri: lambdas/extract/
      Description: >
        Triggered by S3 ObjectCreated. Reads the document, calls Anthropic
        (or returns a mock), and puts structured JSON onto ExtractQueue.
      Timeout: 60
      Environment:
        Variables:
          UPLOAD_BUCKET: "claim-intake-uploads"
          EXTRACT_QUEUE_URL: !Ref ExtractQueue
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          USE_REAL_AI: !Ref UseRealAI
      Policies:
        - S3ReadPolicy:
            BucketName: "claim-intake-uploads"
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ExtractQueue.QueueName

  # ── SQS-triggered verify Lambda ───────────────────────────────────────────
  VerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-verify
      Handler: handler.lambda_handler
      CodeUri: lambdas/verify/
      Description: >
        Consumes ExtractQueue. Runs code checks, writes to DynamoDB with
        conditional put (idempotency), and publishes needs_review claims
        to NeedsReviewQueue.
      Timeout: 60
      Environment:
        Variables:
          CLAIMS_TABLE: !Ref ClaimsTable
          NEEDS_REVIEW_QUEUE_URL: !Ref NeedsReviewQueue
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ClaimsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NeedsReviewQueue.QueueName
      Events:
        SQSExtract:
          Type: SQS
          Properties:
            Queue: !GetAtt ExtractQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ── Scheduled reconcile Lambda ────────────────────────────────────────────
  ReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: claim-intake-reconcile
      Handler: handler.lambda_handler
      CodeUri: lambdas/reconcile/
      Description: >
        Runs on a schedule (EventBridge). Finds S3 objects with no DynamoDB
        record after GapThresholdMinutes, and reports DLQ depth.
        Logs a JSON report suitable for Loki ingestion.
      Timeout: 300
      Environment:
        Variables:
          UPLOAD_BUCKET: "claim-intake-uploads"
          CLAIMS_TABLE: !Ref ClaimsTable
          EXTRACT_DLQ_URL: !Ref ExtractDLQ
          GAP_THRESHOLD_MINUTES: !Ref GapThresholdMinutes
      Policies:
        - S3ReadPolicy:
            BucketName: "claim-intake-uploads"
        - DynamoDBReadPolicy:
            TableName: !Ref ClaimsTable
        - SQSPollerPolicy:
            QueueName: !GetAtt ExtractDLQ.QueueName
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(10 minutes)
            Enabled: true

Outputs:
  ApiUrl:
    Description: Base URL for the claim-intake API
    Value: !Sub "https://${ClaimIntakeApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  BucketName:
    Description: S3 bucket for uploaded claim documents
    Value: !Ref UploadBucket
  ClaimsTableName:
    Description: DynamoDB claims table
    Value: !Ref ClaimsTable
  ExtractQueueUrl:
    Description: SQS queue between extract and verify
    Value: !Ref ExtractQueue
  ExtractDlqUrl:
    Description: Dead-letter queue for failed extract messages
    Value: !Ref ExtractDLQ
  NeedsReviewQueueUrl:
    Description: SQS queue for claims that failed verification
    Value: !Ref NeedsReviewQueue
